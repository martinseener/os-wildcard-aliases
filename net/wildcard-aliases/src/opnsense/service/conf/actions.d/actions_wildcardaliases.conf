[start]
command:/usr/local/etc/rc.d/wildcardaliases start
type:script
message:starting wildcardaliases

[stop]
command:/usr/local/etc/rc.d/wildcardaliases stop
type:script
message:stopping wildcardaliases

[restart]
command:/usr/local/etc/rc.d/wildcardaliases restart
type:script
message:restarting wildcardaliases

[reload]
command:/usr/local/etc/rc.d/wildcardaliases reload
type:script
message:reloading wildcardaliases

[status]
command:/usr/local/etc/rc.d/wildcardaliases status; exit 0
type:script_output
message:requesting wildcardaliases status

[stats]
command:/usr/local/opnsense/scripts/OPNsense/WildcardAliases/status.py
type:script_output
message:requesting wildcardaliases statistics

[entries]
command:/usr/local/opnsense/scripts/OPNsense/WildcardAliases/entries.py
type:script_output
message:requesting wildcardaliases learned addresses
